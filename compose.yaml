services:
  db:
    container_name: mysql
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PROFILE: dev
      DATABASE_URL: jdbc:mysql://db:3306/api?createDatabaseIfNotExist=true
      DATABASE_USER: root
      DATABASE_PWD: root_pass
    depends_on:
      db:
        condition: service_healthy